# Конфигурация бота Komuzik
# Configuration file for Komuzik bot

# Ограничения загрузок
downloads:
  # Максимальное количество одновременных загрузок для обычного пользователя
  max_concurrent_per_user: 3
  
  # ID администраторов с неограниченными загрузками и доступом к /post и /report
  admin_user_ids:
    - 782491733
  
  # ID пользователя с неограниченными загрузками (может загружать более 1 видео одновременно)
  unlimited_user_ids:
    - 782491733
  
  # Максимальное время одной загрузки в секундах. По истечении пользователь
  # получает сообщение о таймауте, а слот освобождается.
  download_timeout_seconds: 3600

# Параметры TikTok
tiktok:
  # Максимальное количество попыток загрузки при ошибках извлечения данных
  max_retries: 3
  
  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2

# Параметры Twitter/X
twitter:
  # Максимальное количество попыток загрузки
  max_retries: 3
  
  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2

# Параметры Pinterest
pinterest:
  # Максимальное количество попыток загрузки
  max_retries: 3

  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2

# Параметры YouTube
youtube:
  # Максимальное количество результатов поиска
  default_search_results: 10
  
  # Качества видео для выбора (в порядке убывания)
  video_fallback_qualities:
    - 1080
    - 720
    - 480
    - 360
    - 240

# Параметры аудио
audio:
  # Формат аудио
  format: 'mp3'
  
  # Битрейт по умолчанию (кбит/сек)
  default_bitrate: '192'
  
  # Пресеты качества
  quality_presets:
    high: 'bestaudio/best'
    medium: 'bestaudio[abr<=128]/bestaudio/best'
    low: 'bestaudio[abr<=96]/bestaudio/best'

# Параметры видео
video:
  # Размеры видео по умолчанию для YouTube
  default_youtube_width: 1280
  default_youtube_height: 720
  
  # Размеры видео для TikTok
  default_tiktok_width: 720
  default_tiktok_height: 1280

# Параметры yt-dlp
yt_dlp:
  # Подавлять стандартный вывод
  quiet: true
  
  # Подавлять предупреждения
  no_warnings: true
  
  # Не загружать плейлисты
  noplaylist: true

  # Таймаут сетевых операций в секундах — чтобы зависшее соединение
  # не держало рабочий поток бесконечно
  socket_timeout: 30

# Размеры выделенных пулов потоков (по умолчанию — ниже)
# downloads/media/render не делят один общий пул: насыщенная загрузка
# больше не блокирует отрисовку статистики и наоборот
executors:
  download_workers: 4
  media_workers: 4
  render_workers: 2
  # Сколько YouTube-extract'ов одновременно при «🖼 Превью»
  enrich_concurrency: 4

# Админская рассылка /post — паузы между получателями и лимит FloodWait
broadcast:
  delay_seconds: 0.07
  progress_every: 25
  max_flood_wait_seconds: 120
