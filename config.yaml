# Конфигурация бота Komuzik
# Configuration file for Komuzik bot

# Ограничения загрузок
downloads:
  # Максимальное количество одновременных загрузок для обычного пользователя
  max_concurrent_per_user: 3
  
  # ID администраторов с неограниченными загрузками и доступом к /post и /report
  admin_user_ids:
    - 782491733
  
  # ID пользователя с неограниченными загрузками (может загружать более 1 видео одновременно)
  unlimited_user_ids:
    - 782491733
  
  # Максимальное время жизни одной загрузки в секундах (для очистки зависших загрузок)
  download_timeout_seconds: 3600
  
  # Период проверки зависших загрузок в секундах
  cleanup_interval_seconds: 300

# Параметры TikTok
tiktok:
  # Максимальное количество попыток загрузки при ошибках извлечения данных
  max_retries: 3
  
  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2
  
  # Сообщение об ошибке при недоступности видео
  error_message: "Не удается загрузить видео с TikTok. Видео может быть недоступно, удалено или заблокировано. Пожалуйста, проверьте ссылку и попробуйте позже."

# Параметры Twitter/X
twitter:
  # Максимальное количество попыток загрузки
  max_retries: 3
  
  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2
  
  # Сообщение об ошибке при недоступности видео
  error_message: "Не удается загрузить видео с Twitter/X. Пожалуйста, проверьте ссылку и попробуйте позже."

# Параметры Pinterest
pinterest:
  # Максимальное количество попыток загрузки
  max_retries: 3

  # Задержка перед первой попыткой повтора в секундах
  retry_backoff_base: 2

  # Сообщение об ошибке при недоступности медиа
  error_message: "Не удается загрузить медиа с Pinterest. Пожалуйста, проверьте ссылку и попробуйте позже."

# Параметры YouTube
youtube:
  # Максимальное количество результатов поиска
  default_search_results: 5
  
  # Качества видео для выбора (в порядке убывания)
  video_fallback_qualities:
    - 1080
    - 720
    - 480
    - 360
    - 240

# Параметры аудио
audio:
  # Формат аудио
  format: 'mp3'
  
  # Битрейт по умолчанию (кбит/сек)
  default_bitrate: '192'
  
  # Пресеты качества
  quality_presets:
    high: 'bestaudio/best'
    medium: 'bestaudio[abr<=128]/bestaudio/best'
    low: 'bestaudio[abr<=96]/bestaudio/best'

# Параметры видео
video:
  # Размеры видео по умолчанию для YouTube
  default_youtube_width: 1280
  default_youtube_height: 720
  
  # Размеры видео для TikTok
  default_tiktok_width: 720
  default_tiktok_height: 1280

# Параметры yt-dlp
yt_dlp:
  # Подавлять стандартный вывод
  quiet: true
  
  # Подавлять предупреждения
  no_warnings: true
  
  # Не загружать плейлисты
  noplaylist: true

# Сообщения пользователю
messages:
  start: |
    👋 Привет! Я бот для скачивания видео и музыки с YouTube, TikTok, Twitter/X и Pinterest.

    📺 **YouTube**: выбирайте качество видео и аудио
    🎵 **TikTok**: автоматическая загрузка видео

    Просто отправьте мне ссылку на видео!

    ⚙️ /settings — подпись @бота и название видео (по умолчанию оба вкл.)

    💬 **В любом чате:** напишите `@komuzik_bot ссылка` — медиа уйдёт как via-сообщение.
    Для YouTube: `@komuzik_bot music ссылка` или `@komuzik_bot 480 ссылка`.
    Один раз напишите боту /start в ЛС — иначе inline не сможет отправить файл.

    Для получения помощи используйте команду /help.

    Используя бота, вы соглашаетесь с [правилами использования](https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20).

  privacy: |
    📄 Правила пользования и политика конфиденциальности:
    https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20

  help: |
    🔍 **Как пользоваться ботом:**

    1. Отправьте мне ссылку на видео YouTube, TikTok, Twitter/X или Pinterest
    2. Используйте /search для поиска видео на YouTube
    3. Для YouTube: выберите тип контента (видео или аудио) и качество
    4. Для YouTube Shorts, TikTok, Twitter/X и Pinterest: контент скачается автоматически
    5. Дождитесь загрузки и получите файл

    💬 **Inline в чатах:**
    • `@komuzik_bot <ссылка>` — скачать и отправить в чат
    • YouTube: `@komuzik_bot music <ссылка>` — аудио
    • YouTube: `@komuzik_bot 360|480|720|1080 <ссылка>` — качество видео (по умолчанию 720p)
    • Остальные платформы — только ссылка, без префиксов
    • Сначала напишите боту /start в личке (нужно для доставки файла)

    📌 **Доступные команды:**
    /start - Запустить бота
    /help - Показать справку
    /privacy - Правила и политика конфиденциальности
    /settings - Подпись бота и название видео
    /search <запрос> - Поиск видео на YouTube
    /stats - Показать статистику бота
    /report - Отправить отчет об ошибке

    🎬 **Поддерживаемые платформы:**
    • YouTube (с выбором качества)
    • YouTube Shorts (автоматическая загрузка)
    • TikTok (автоматическая загрузка)
    • Twitter/X (видео и фото)
    • Pinterest (видео и фото)
