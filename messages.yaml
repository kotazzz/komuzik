# Пользовательские тексты бота Komuzik (только RU).
# Правьте здесь; в коде — t("ключ").
# Подстановки: {name} в строке и t("key", name=...).

start: |-
  👋 Привет! Я Komuzik — скачиваю видео и музыку с YouTube, TikTok, X и Pinterest.

  Пришлите ссылку — дальше подскажу, что выбрать (для YouTube: видео или аудио и качество).

  Если что-то непонятно — `/help`.
  Настройки подписи к файлам — `/settings`.

  Пользуясь ботом, вы принимаете [правила](https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20).

privacy: |-
  📄 Правила пользования и политика конфиденциальности:

  https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20

info:
  github_url: https://github.com/kotazzz/komuzik
  body: |-
    ℹ️ **О Komuzik**

    Автор: **Kotaz**
    Код: https://github.com/kotazzz/komuzik

    Нашли баг или есть жалоба — команда `/report`.
  button_source: Исходный код

errors:
  download: |-
    Не удалось скачать это видео. Проверьте ссылку или попробуйте позже.
  download_unavailable: |-
    ❌ Это видео сейчас не скачать.

    Часто так бывает, если ролик недоступен, ограничен по возрасту или требует входа на площадке.
  pm_unavailable: |-
    ❌ Не получается отправить файл вам в личку.

    Откройте диалог с ботом и нажмите /start (или уберите бота из чёрного списка), потом повторите запрос.
  tiktok: |-
    Не удалось скачать это видео с TikTok. Возможно, оно удалено, скрыто или временно недоступно. Попробуйте другую ссылку чуть позже.
  twitter: |-
    Не удалось скачать это с X (Twitter). Проверьте ссылку или попробуйте позже.
  pinterest: |-
    Не удалось скачать это с Pinterest. Проверьте ссылку или попробуйте позже.
  no_access: Нет доступа.
  download_timeout: |-
    ⏱ Загрузка идёт слишком долго и была прервана.

    Обычно это значит, что площадка отдаёт файл очень медленно. Попробуйте качество пониже или повторите позже.
  download_too_large: |-
    📦 Файл слишком большой для загрузки.

    Выберите качество пониже или скачайте более короткий ролик.

help:
  toc: |-
    🔍 **Справка**

    Выберите тему — расскажу по шагам, без каши из всего сразу.

    Про автора и код бота: `/info`.
  admin_toc: |-
    🛠 **Справка для админа**

    Команды и настройки бота по разделам.
    «← Назад» — к обычной справке.
  buttons:
    back: ← Назад
    for_admin: 🛠 Для админа
    start: С чего начать
    platforms: Платформы
    playlists: Плейлисты
    inline: В чатах (inline)
    groups: Группы
    commands: Команды
    panel: Панель
    limits: Лимиты
    bans: Блокировки
    users: Пользователи
    storage: Хранилище
    post: Рассылка
  pages:
    start: |-
      🚀 **С чего начать**

      Самый простой сценарий — в личке с ботом:

      1. Пришлите ссылку на ролик.
      2. Если это YouTube — выберите видео или аудио, потом качество.
      3. Подождите немного и получите файл.

      Shorts, TikTok, X и Pinterest обычно качаются сразу, без лишних кнопок.

      Подпись под файлом (@бот и название) можно включить или выключить в `/settings`.

      Другие сценарии — в соседних разделах: плейлисты, группы, отправка из любого чата.
    platforms: |-
      🎬 **Что умеет качать**

      **YouTube**
      Можно взять обычное видео или только звук. Качество выбираете кнопками; бот также может предложить повторить ваш прошлый выбор.

      **YouTube Shorts**
      Качается как обычное короткое видео, без меню формата.

      **TikTok**
      Обычно одна кнопка не нужна — прислали ссылку, получили ролик.

      **X (Twitter)**
      Видео, фото и несколько картинок в одном посте.

      **Pinterest**
      Картинки и видео по ссылке на пин.

      Если площадка не отдаёт файл (возраст, приватность, вход), бот напишет коротко и по-человечески — без простыни ошибок.

      Найти ролик на YouTube по словам: `/search ваш запрос`.
    playlists: |-
      📑 **Плейлисты**

      Работают ссылки на плейлисты YouTube и YouTube Music.
      Этот режим — **только в личке** с ботом (в группе целиком плейлист не разбираем).

      Как это выглядит:

      1. Присылаете ссылку на плейлист.
      2. Бот показывает список треков. Можно листать страницами.
      3. Ненужные треки можно убрать: ответьте на это сообщение номерами, например `1 3 5` или диапазоном `2-4`.
      4. Выбираете видео или аудио и качество.
      5. Файлы уходят пачками. Если передумали — есть кнопка «Стоп».

      У обычных пользователей есть суточный лимит на число элементов из плейлистов. Когда лимит кончится, бот скажет об этом прямо. Текущие лимиты можно посмотреть командой `/limits`.
    inline: |-
      💬 **Отправка из любого чата**

      Можно не переписываться с ботом в личке, а вызвать его прямо там, где вы пишете.

      Начните сообщение с `@` и имени бота, затем укажите, что скачать.

      **Просто ссылка**
      Бот скачает и отправит файл в этот чат.

      **Поиск на YouTube**
      Напишите текст без ссылки — бот покажет до 5 роликов (только текст, без картинок). После выбора скачает видео в качестве из `/settings`.
      Превью картинками — только в личке: `/search ваш запрос` → кнопка «Превью».

      **YouTube — только музыка**
      Перед ссылкой напишите `music` (или `audio`).

      **YouTube — своё качество видео**
      Перед ссылкой укажите `360`, `480`, `720` или `1080`.
      Если ничего не указать, возьмётся качество из ваших `/settings`.

      Для TikTok, X и Pinterest достаточно одной ссылки — без префиксов.

      **Важно**
      Telegram отдаёт файл через личный диалог с ботом. Если вы ещё ни разу не открывали бота, один раз зайдите в личку и нажмите /start — иначе inline не сможет доставить медиа.

      Пока идёт загрузка, на месте результата будет «Загрузка…», потом оно сменится на файл.
    groups: |-
      👥 **В группах**

      Добавьте бота в группу и пришлите туда ссылку — он может скачать ролик сам, если это разрешено настройками чата.

      Кто может менять правила группы: администраторы чата через `/settings` прямо в группе.
      Там же включают или выключают площадки, подписи к файлам и качество YouTube по умолчанию.

      Ваши личные предпочтения (подпись, качество для inline) по-прежнему живут в `/settings` в личке с ботом.
    commands: |-
      📌 **Команды**

      `/start` — короткое приветствие
      `/help` — эта справка по разделам
      `/info` — кто сделал бота и где код
      `/settings` — подпись к файлам и качество по умолчанию
      `/search …` — поиск на YouTube (до 10 результатов, превью по кнопке)
      `/stats` — статистика бота
      `/limits` — ваши текущие лимиты
      `/report` — сообщить о проблеме
      `/privacy` — правила и политика

      Баги и жалобы лучше слать через `/report` — так сообщение точно дойдёт до админов.
  admin_pages:
    panel: |-
      🛠 **Админ-панель**

      Команда `/admin` показывает сводку: сколько одновременных загрузок разрешено, какой глобальный лимит плейлиста на сутки и сколько сейчас блокировок.

      С панели же можно:
      • поменять лимит одновременных загрузок;
      • поменять суточный лимит плейлиста;
      • открыть список пользователей.
    limits: |-
      📊 **Лимиты**

      `/setconcurrent N` — сколько загрузок один человек может вести параллельно (число ≥ 1).

      `/setplaylistlimit N` — сколько элементов плейлиста обычный пользователь может успешно получить за сутки (по московскому времени).

      `/setuserlimit <айди> N` — отдельный лимит плейлиста для конкретного человека.
      `/unsetuserlimit <айди>` — убрать персональный лимит.

      Те же числа можно задать кнопками на `/admin`: бот попросит просто прислать число.

      Админы бота суточную квоту плейлиста не тратят.
    bans: |-
      🚫 **Блокировки**

      `/ban <айди> причина` — закрыть доступ.
      `/unban <айди>` — вернуть доступ.

      В личке и в inline человек увидит сообщение о блокировке.
      В группах бот его просто игнорирует.
      Команда `/report` у заблокированных всё ещё работает — чтобы можно было написать о проблеме.
    users: |-
      👥 **Пользователи и история**

      `/users` (или кнопка на панели) — список с вкладками «Известные» и «Анонимы».

      `/user <айди>` — карточка: кто это, какие лимиты, и история загрузок.
      История листается страницами (по 10 записей, смотрим недавние).

      В записи обычно видно площадку, тип (видео/аудио), качество, ссылку и название — если они сохранились.
    storage: |-
      📦 **Группа-хранилище**

      Отдельная группа, куда бот временно кладёт файлы (плейлисты и inline), чтобы потом отдать их без пометки «переслано».

      Как подключить:
      1. Создайте (или выберите) группу и добавьте бота.
      2. Дайте боту право удалять сообщения.
      3. В этой группе от имени админа бота выполните `/setstorage`.

      `/unsetstorage` — отвязать хранилище.

      Если хранилища нет, inline по-прежнему стейджится в личку пользователя — и тогда человеку нужен открытый диалог с ботом (/start).
    post: |-
      📣 **Рассылка**

      Ответьте командой `/post` на сообщение, которое хотите разослать всем известным пользователям бота.

      Используйте редко и осознанно: это массовая рассылка.

