# Пользовательские тексты бота Komuzik (только RU).
# Правьте здесь; в коде — t("ключ").
# Подстановки: {name} в строке и t("key", name=...).

start: |-
  👋 Привет! Я бот для скачивания видео и музыки с YouTube, TikTok, Twitter/X и Pinterest.

  📺 **YouTube**: выбирайте качество видео и аудио
  🎵 **TikTok**: автоматическая загрузка видео

  Просто отправьте мне ссылку на видео!

  ⚙️ /settings — подпись @бота и название видео (по умолчанию оба вкл.)

  💬 **В любом чате:** напишите `@komuzik_bot ссылка` — медиа уйдёт как via-сообщение.
  Для YouTube: `@komuzik_bot music ссылка` или `@komuzik_bot 480 ссылка`.
  Один раз напишите боту /start в ЛС — иначе inline не сможет отправить файл.

  Для получения помощи используйте команду /help.

  Используя бота, вы соглашаетесь с [правилами использования](https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20).
privacy: |-
  📄 Правила пользования и политика конфиденциальности:
  https://telegra.ph/Pravila-polzovaniya-i-politika-konfidencialnosti-bota-Komuzik-07-20
info:
  github_url: https://github.com/kotazzz/komuzik
  body: |-
    ℹ️ **О боте Komuzik**

    Исходный код: https://github.com/kotazzz/komuzik
    Автор: **Kotaz**

    Нашли ошибку или есть жалоба — напишите `/report`.
  button_source: Исходный код
errors:
  download_unavailable: |-
    ❌ Не удалось скачать это видео.
    Возможно, оно недоступно, ограничено по возрасту или требует входа.
  pm_unavailable: |-
    ❌ Не могу отправить файл в ваш ЛС.

    Откройте бота и нажмите /start (или уберите бота из чёрного списка), затем повторите inline-запрос.
  tiktok: |-
    Не удается загрузить видео с TikTok. Видео может быть недоступно, удалено или заблокировано. Пожалуйста, проверьте ссылку и попробуйте позже.
  twitter: |-
    Не удается загрузить видео с Twitter/X. Пожалуйста, проверьте ссылку и попробуйте позже.
  pinterest: |-
    Не удается загрузить медиа с Pinterest. Пожалуйста, проверьте ссылку и попробуйте позже.
  no_access: Нет доступа.
help:
  toc: |-
    🔍 **Справка Komuzik**

    Выберите раздел кнопкой ниже.
    Об авторе и исходном коде — команда `/info`.
  admin_toc: |-
    🛠 **Справка для админа**

    Разделы по командам и лимитам. «← Назад» вернёт к обычной справке.
  buttons:
    back: ← Назад
    for_admin: 🛠 Для админа
    start: Старт
    platforms: Платформы
    playlists: Плейлисты
    inline: Inline
    groups: Группы
    commands: Команды
    panel: Панель
    limits: Лимиты
    bans: Блокировки
    users: Пользователи
    storage: Хранилище
    post: Рассылка
  pages:
    start: |-
      🚀 **С чего начать**

      1. Напишите боту `/start` в личке (нужно и для inline).
      2. Пришлите ссылку на ролик или плейлист — в ЛС или в группе, где есть бот.
      3. Для YouTube выберите **видео** или **аудио**, затем качество.
      4. Дождитесь файла. Если что-то пошло не так — `/report`.

      Подпись с @ботом и названием ролика настраиваются в `/settings`.
      Об авторе и исходниках — `/info`.
    platforms: |-
      🎬 **Платформы**

      • **YouTube** — видео (360p–1080p) или аудио (высокое / среднее / низкое). Можно повторить последний выбранный формат одной кнопкой.
      • **YouTube Shorts** — скачивается сразу как видео.
      • **TikTok** — видео автоматически.
      • **Twitter / X** — видео, фото, альбомы.
      • **Pinterest** — видео и фото.

      Если ролик недоступен, ограничен по возрасту или требует входа — бот напишет понятное сообщение вместо сырой ошибки.

      Поиск роликов на YouTube: `/search запрос`.
    playlists: |-
      📑 **Плейлисты YouTube / YouTube Music**

      Только в **личке** с ботом.

      1. Пришлите ссылку на плейлист.
      2. Откроется превью со списком треков — листайте ⬅️➡️.
      3. Чтобы **исключить** треки: ответьте на сообщение превью номерами (например `1 3 5` или `2-4`).
      4. Выберите **Видео** или **Аудио** и качество.
      5. Бот шлёт пачками; можно нажать **Стоп**.

      Есть **суточный лимит** элементов плейлиста (для обычных пользователей). Админы бота безлимитны.
    inline: |-
      💬 **Inline в любом чате**

      Напишите `@имя_бота` и дальше:
      • просто **ссылку** — скачать и отправить в чат;
      • YouTube аудио: `music` (или `audio`) и ссылку;
      • YouTube видео: `360` / `480` / `720` / `1080` и ссылку (если префикса нет — качество из `/settings`).

      Остальные платформы — только ссылка, без префиксов.

      ⚠️ Один раз напишите боту `/start` в ЛС — иначе файл не доставится.
      Сначала появится «Загрузка…», затем медиа.
    groups: |-
      👥 **Группы**

      В группе сошлитесь на ролик — бот может скачать его автоматически (с учётом настроек чата).

      Админы чата: `/settings` в группе — какие платформы разрешены, подписи и качество по умолчанию.

      Персональные `/settings` работают в личке с ботом.
    commands: |-
      📌 **Команды**

      `/start` — приветствие и краткий гайд
      `/help` — эта справка по разделам
      `/info` — автор, исходный код, куда писать о багах
      `/settings` — подпись @бота, название, качество по умолчанию
      `/search запрос` — поиск на YouTube
      `/stats` — статистика бота
      `/report` — сообщить об ошибке или проблеме
      `/privacy` — правила и политика

      Жалобы и баги — только через `/report` (не в личку автору).
  admin_pages:
    panel: |-
      🛠 **Админ-панель**

      `/admin` — сводка: одновременные загрузки, лимит плейлиста / сутки, число блокировок.

      Кнопки на панели:
      • **Одновременные** — лимит параллельных загрузок на пользователя;
      • **Лимит плейлиста** — глобальная суточная квота элементов;
      • **Пользователи** — список и история.
    limits: |-
      📊 **Лимиты**

      `/setconcurrent N` — макс. одновременных загрузок (≥ 1)
      `/setplaylistlimit N` — плейлист-элементов на пользователя в сутки (МСК)
      `/setuserlimit <айди> N` — персональный лимит плейлиста
      `/unsetuserlimit <айди>` — сбросить персональный лимит

      Можно задать число и через кнопки панели (бот попросит ввести значение).
      Админы бота не расходуют суточную квоту плейлиста.
    bans: |-
      🚫 **Блокировки**

      `/ban <айди> причина` — заблокировать пользователя
      `/unban <айди>` — снять блок

      В ЛС и inline заблокированный видит сообщение о блокировке.
      В группах бот его игнорирует (тишина).
      `/report` у заблокированных по-прежнему принимается.
    users: |-
      👥 **Пользователи и история**

      `/users` или кнопка на `/admin` — список с вкладками **Известные** / **Анонимы**.
      `/user <айди>` — карточка: профиль, лимиты, история загрузок (страницы по 10, до 50 записей).

      В истории: платформа, видео/аудио, качество, ссылка и название (если сохранились).
    storage: |-
      📦 **Группа-хранилище**

      Нужна, чтобы стейджить медиа (плейлист / inline) без «Переслано от».

      `/setstorage` — **в группе-хранилище**, от имени админа бота: запомнить этот чат. У бота должно быть право удалять сообщения.
      `/unsetstorage` — отвязать хранилище.

      Без хранилища inline стейджится в ЛС пользователя (нужен `/start`).
    post: |-
      📣 **Рассылка**

      `/post` — ответом на сообщение, которое нужно разослать всем известным пользователям бота.

      Используйте осторожно.
