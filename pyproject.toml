[project]
name = "komuzik"
version = "0.1.0"
description = ""
authors = [{ name = "Kotaz", email = "semechkagent@gmail.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
dependencies = [
    "gallery-dl>=1.31.10",
    "pillow>=12.3.0",
    "pyrogram>=2.0.106",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "telethon>=1.42.0",
    "tgcrypto>=1.2.5",
    "yt-dlp>=2026.3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Документация (Docstrings) ---
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # Не требуем docstrings для всего подряд
    "D203", "D213", # Конфликтующие правила оформления docstrings
    "D205", "D400", "D415", # Игнорируем пунктуацию и пустые строки в заголовках

    # --- Безопасность и логирование ---
    "G004",    # Разрешаем f-strings в логировании (удобнее для небольшого бота)
    "S101",    # assert — иногда полезен для type narrowing вне тестов (в разумных пределах)
    "S105", "S106", "S107", # Игнорируем ложные срабатывания на "hardcoded password" в коде
    "S608",    # SQL строится из внутренних констант фильтров периода; не user-input

    # --- Архитектура и стиль ---
    "INP001",  # Не требуем __init__.py в корневых папках (важно для работы uv/пространств имен)
    "ANN001", "ANN201", "ANN202", "ANN204", "ANN401", # Сигнатуры без избыточных аннотаций
    "FBT001", "FBT002", "FBT003", # Разрешаем bool-параметры для трекинга success/failure
    "PTH103", "PTH107", "PTH109", "PTH110", "PTH118", "PTH120", "PTH208", # os.path/os.makedirs допустимы в небольшом боте
    "BLE001", "TRY300", "TRY400", # Не принуждаем к узким except/else/exception-style в handlers/repo
    "TRY002", "TRY003", # Разрешаем простые Exception в boundary-слоях загрузчиков
    "EM101", "EM102", # Разрешаем строки и f-строки прямо в raise Exception
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", # Снижаем шум по complexity/magic numbers
    "C901", "D401", "RET503", "RET504", # Не принуждаем к микрорефакторингу для простого бота
    "B904", "B007", "PERF401", "F841", "SIM105", "S110", # Стиль/микрооптимизации не блокируют релиз
    "S603", "S607", "PLC0415", "PLW1510", # subprocess warnings контролируются ручной валидацией аргументов
    "ASYNC240", # AnyIO/trio path рекомендации не применяются в проекте на asyncio + stdlib
    
    # --- Локализация и форматирование ---
    "RUF001", "RUF013", "RUF059", # Локализованные строки и упрощенные сигнатуры/распаковки
    "E501", "W291", # Длинные русскоязычные пользовательские строки и артефакты SQL-литералов
    "COM812",  # Игнорируем, так как может конфликтовать с ruff format
    "ISC001",  # Игнорируем, так как может конфликтовать с ruff format
]

[tool.ruff.lint.per-file-ignores]
# Настройки для тестов (команда `just test`)
"**/tests/*" = [
    "S101",    # В тестах assert обязателен
    "PLR2004", # Магические числа (ID, статус-коды) в тестах — ок
    "ARG001",  # Неиспользуемые фикстуры pytest — частое явление
    "SLF001",  # Доступ к private членам для тестирования внутренностей
]

# Настройки для сгенерированных контрактов (команда `just gen-contracts`)
"contracts/qutty_contracts/**" = [
    "ALL",     # Не проверяем автогенерированный код gRPC/Protobuf
]

[tool.ruff.lint.isort]
# Группировка импортов (чтобы Telethon и yt-dlp были в правильном порядке)
known-first-party = ["komuzik"]
combine-as-imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
